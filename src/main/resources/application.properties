spring.application.name=LearnWave
server.port=8080
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Lista separada por vírgulas. Em produção, substitua com CHAT_MODERATION_BLOCKED_WORDS no Render.
# A comparação ignora maiúsculas/minúsculas e acentos.
chat.moderation.blocked-words=${CHAT_MODERATION_BLOCKED_WORDS:porra,merda,caralho,puta,buceta,cacete,cu,arrombado,otario,idiota,imbecil,fdp,filho da puta,vai se foder,foda-se}
